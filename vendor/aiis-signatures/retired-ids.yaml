# Retired AIIS signature ids. An id is never reused. A record is added whenever a
# signature file is deleted from signatures/ (see CONTRIBUTING.md, Retiring a
# signature). The AIIS-NNNN ids below were the numeric seed catalogue that
# predated the named corpus; each is mapped to the corpus signature that carries
# its intent, narrowed where the seed pattern was a false positive source, or
# retired where nothing in the corpus should carry it. Pattern fragments in the
# reason field are literal: a pipe is an alternation, not YAML syntax.
#
# disposition: retired | superseded | superseded_narrowed
# superseded_by: present only for superseded and superseded_narrowed, and names
