name: Claims

# The README states counts and coverage claims (tactics, techniques, attack
# classes, evidence tiers, detection/control/lab coverage). Those are
# measurements over matrix.json, so they are enforced here rather than
# maintained by hand.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Daily drift check of the live registry against this repo's matrix.json.
    # 06:50 UTC — after the registry's own data movements settle, off the :00 peak.
    - cron: "50 6 * * *"

permissions:
  contents: read

jobs:
  readme-claims:
    name: README claims match matrix.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # validate_matrix.py S11 reads matrix.json at the commit technique-ids.json
          # names; a shallow clone lacks it and checks only the sha's shape.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: README claims match matrix.json
        run: python3 scripts/check_readme_claims.py

      # The per-technique pages repeat two matrix.json fields (attack class, OASB
      # controls) as prose. Both cited nonexistent OASB controls for five months,
      # and correcting the data left the pages behind; keep them derived.
      - name: Technique pages match matrix.json
        run: python3 scripts/check_technique_pages.py

      # The cross-references/ overlap index partitions every technique into one of two
      # published lists and renders its counts from matrix.json. Keep the partition and
      # the counts derived: a hand-typed tally on these pages shipped once already.
      - name: Cross-reference overlap index matches matrix.json
        run: python3 scripts/check_cross_references.py

      # canonical-classes.json maps the behavior-axis classes onto matrix.json
      # technique ids. The mapping is authored, not derived, so only its shape is
      # enforceable: known class names, ids that exist, primary a partition,
      # per-class arrays sorted and disjoint.
      - name: Canonical classes match matrix.json
        run: python3 scripts/check_canonical_classes.py

      # ATTRIBUTION.md partitions every technique id into externally contributed or
      # authored in-house, on the same terms as the cross-reference partition above.
      # External entries must name the submission they arrived in: on a public record
      # about named people, credit is recorded, never guessed.
      - name: Attribution record partitions matrix.json
        run: python3 scripts/check_attribution.py

      # Every page that defines an evidence tier quotes docs/evidence-tiers.md word for word.
      - name: Evidence tier definitions quote docs/evidence-tiers.md
        run: python3 scripts/check_evidence_tiers.py

      # matrix.json against its schema and the semantic rules S1 onward, including the
      # STIX bundle and evidence-gaps.json rendered from it.
      - name: matrix.json validates
        run: python3 scripts/validate_matrix.py

      - name: Markdown prose rules
        run: python3 scripts/check_docs_prose.py

      # The family pages under attack-classes/ are a rendering of matrix.json; --check
      # writes nothing and fails when they differ from a fresh rendering.
      - name: Family pages match matrix.json
        run: python3 scripts/generate_class_markdown.py --check

      - name: Install pytest
        run: python3 -m pip install pytest

      - name: Tests
        run: python3 -m pytest -q

  live-api-drift:
    # The registry serves this matrix at api.oa2a.org and threats.opena2a.org
    # renders that payload. Version bumps originate HERE, so this is where the
    # guard belongs: fail red when the live API's version, created date, or
    # tactic/technique/class counts differ from matrix.json. Read-only — no
    # secret in this public repo. A red run between a spec bump and the next
    # registry import is the feature (the drift window made visible), not a flake.
    name: Live registry matches matrix.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Live registry matches matrix.json
        run: python3 scripts/check_live_api_drift.py
